{% extends "base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/broadcast_system.css' %}">

<div class="broadcast-container">

    <form method="post">
        {% csrf_token %}

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div class="d-flex flex-wrap gap-4">
            <div class="broadcast-left flex-grow-1">
                <h2>Broadcast System</h2>

                <div class="form-group">
                    <label>Title / Subject</label>
                    <input type="text" name="title" required placeholder="e.g. แจ้งซ่อมด่วน">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" name="message" required></textarea>
                </div>

                <div class="calendar-box">
                    <label>Select Date (optional)</label>
                    <input type="date" name="scheduled_date">
                </div>
            </div>

            <div class="broadcast-right flex-grow-1">
                <h3>Broadcast time (optional)</h3>

                <select name="scheduled_time" class="form-select mb-3">
                    <option value="">— not specified —</option>
                    {% for hour in time_slots %}
                        <option value="{{ hour }}">{{ hour }}</option>
                    {% endfor %}
                </select>

                <button type="submit" class="send-btn">
                    Send Broadcast
                </button>
            </div>
        </div>
    </form>

</div>

{% endblock %}
