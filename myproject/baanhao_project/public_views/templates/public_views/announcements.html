{% extends 'public_views/base_public.html' %}

{% block content %}
<div class="container py-4"> 
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark m-0">ประกาศทั้งหมด</h2>
            <small class="text-secondary">ภาพรวมข่าวสารจากนิติบุคคล</small>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12">
            <div class="bg-white rounded-4 shadow-sm p-4">
                
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <h5 class="fw-bold text-dark m-0">📢 ประกาศล่าสุด</h5>
                </div>

                <div class="d-flex flex-column gap-3">
                    {% for ann in announcements %}
                    <div class="d-flex justify-content-between align-items-start pb-3 {% if not forloop.last %}border-bottom border-light{% endif %}">
                        <div class="me-3">
                            <div class="fw-bold text-dark mb-1">{{ ann.title }}</div>
                            <p class="text-secondary mb-0" style="font-size: 0.95rem;">{{ ann.message }}</p>
                        </div>
                        <span class="badge rounded-pill bg-light text-secondary border px-3 py-2 text-nowrap shadow-sm">
                            {{ ann.created_at|date:"d M Y" }}
                        </span>
                    </div>
                    {% empty %}
                    <div class="text-secondary text-center py-5">
                        <i class="bi bi-inbox fs-1 text-light mb-2 d-block"></i>
                        ยังไม่มีประกาศใหม่ในขณะนี้
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
